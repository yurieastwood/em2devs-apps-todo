name: CI Pipeline|Seven Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-branch-name:
    name: "Lint|Branch Name"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if echo "$BRANCH" | grep -qE "^(feat|fix|chore|hotfix)/.+$"; then
            echo "✓ Branch '${BRANCH}' follows conventional naming"
          elif echo "$BRANCH" | grep -qE "^release/.+$"; then
            echo "✓ Branch '${BRANCH}' follows conventional naming"
          else
            echo "::error::Invalid branch name: '${BRANCH}'"
            echo ""
            echo "Expected: <type>/<description>"
            echo "Allowed: feat/, fix/, chore/, hotfix/, release/"
            exit 1
          fi

  lint-commit-messages:
    name: "Lint|Commit Messages"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit messages
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          PATTERN="^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?!?: .{1,}"
          SKIP="^(Merge |Revert |Initial commit|fixup! |squash! )"
          FAILED=0
          while IFS= read -r msg; do
            if echo "$msg" | grep -qE "$SKIP"; then
              echo "✓ (skip) $msg"
              continue
            fi
            if echo "$msg" | grep -qE "$PATTERN"; then
              echo "✓ $msg"
            else
              echo "✗ $msg"
              FAILED=1
            fi
          done < <(git log --format="%s" "origin/${BASE_REF}..HEAD")
          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "::error::One or more commit messages do not follow Conventional Commits"
            echo "Expected: <type>[optional scope]: <description>"
            echo "Valid types: feat, fix, docs, style, refactor, test, chore, perf, ci, build, revert"
            exit 1
          fi

  frontend-lint:
    name: "Frontend|Lint & Type Check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/EM2Devs.Todo.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/EM2Devs.Todo.Web/.nvmrc
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check

  frontend-test:
    name: "Frontend|Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/EM2Devs.Todo.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/EM2Devs.Todo.Web/.nvmrc
      - run: npm ci
      - run: npm run test

  e2e-tests:
    name: "E2E|Playwright Tests"
    needs: [gate-1-compile, frontend-test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/EM2Devs.Todo.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/EM2Devs.Todo.Web/.nvmrc
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start API via Aspire
        working-directory: .
        run: |
          dotnet run --project src/EM2Devs.Todo.AppHost &
          for i in $(seq 1 90); do
            curl -sf http://localhost:5001/api/tasks > /dev/null 2>&1 && break || sleep 1
          done
          curl -sf http://localhost:5001/api/tasks > /dev/null || (echo "API failed to start" && exit 1)
        env:
          AUTO_MIGRATE: "true"
      - run: npx playwright test
        env:
          API_BASE_URL: http://localhost:5001
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: src/EM2Devs.Todo.Web/test-results/
          retention-days: 7

  gate-1-compile:
    name: "G1|Compiler / Type System"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet build --configuration Release /p:TreatWarningsAsErrors=true

  gate-2-format:
    name: "G2|Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet format --verify-no-changes --verbosity diagnostic

  gate-3-architecture:
    name: "G3|Architecture Fitness Tests"
    needs: gate-1-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet test tests/EM2Devs.Todo.ArchitectureTests --configuration Release --logger "console;verbosity=detailed"

  gate-4-tests:
    name: "G4|Scenario-Driven Tests"
    needs: gate-1-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet test --configuration Release --filter "Category!=Architecture" --logger "console;verbosity=detailed"

  gate-5-security:
    name: "G5|Supply Chain Security"
    needs: gate-1-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet restore
      - name: Check for vulnerable packages
        run: |
          OUTPUT=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages found|update or replace them"
            exit 1
          fi

  gate-6-contracts:
    name: "G6|API Contract Validation"
    needs: gate-1-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Static validation (Spectral)
        run: npx --yes @stoplight/spectral-cli lint docs/contracts/openapi.yaml --ruleset .spectral.yaml
      - name: Install Schemathesis
        run: pip install "schemathesis==4.11.2"
      - name: Build API
        run: dotnet build src/EM2Devs.Todo.Api --configuration Release
      - name: Start API
        run: |
          nohup dotnet run --project src/EM2Devs.Todo.Api --configuration Release --no-build \
            --urls "http://localhost:5001" > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 30); do
            curl -s http://localhost:5001/api/tasks > /dev/null 2>&1 && break || sleep 1
          done
      - name: Dynamic validation (Schemathesis)
        run: schemathesis run docs/contracts/openapi.yaml --url http://localhost:5001 --checks all --phases examples,coverage,stateful
      - name: Stop API
        if: always()
        run: kill $(cat /tmp/api.pid) 2>/dev/null || true

  gate-7-mutation:
    name: "G7|Mutation Testing"
    needs: gate-4-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet tool restore
      - name: Run mutation testing (since mode on PRs)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
            dotnet stryker -f stryker-config.json --since:origin/${{ github.base_ref }}
          else
            dotnet stryker -f stryker-config.json
          fi
