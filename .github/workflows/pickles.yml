name: BDD Living Documentation

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build BDD Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            9.0.x
      - name: Install Pickles
        run: dotnet tool install Pickles.CommandLine --version 4.0.3 --tool-path ./tools
      - name: "Preprocess feature files (strip Rule keyword unsupported by Pickles)"
        run: |
          mkdir -p .pickles/features
          cp -R docs/features/. .pickles/features/
          find .pickles/features -name '*.feature' -exec sed -i '/^[[:space:]]*Rule:/d' {} +
      - name: Generate living documentation
        run: |
          ./tools/pickles --feature-directory=.pickles/features --output-directory=.pickles/out --documentation-format=dhtml || true
          test -f .pickles/out/Index.html || (echo "Pickles failed to generate any output" && exit 1)
      - name: Stage Pages content under /features
        run: |
          rm -rf _pages
          mkdir -p _pages/features
          cp -R .pickles/out/. _pages/features/
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=/features/"></head><body><a href="/features/">BDD Living Documentation</a></body></html>' > _pages/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
