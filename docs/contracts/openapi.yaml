        - pattern
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "^[^\\x00-\\x1f\\x7f-\\x9f]*[^\\x00-\\x1f\\x7f-\\x9f\\s][^\\x00-\\x1f\\x7f-\\x9f]*$"
        pattern:
          type: string
          enum:
            - Daily
            - Weekly
            - Monthly
    UpdateRecurringTaskRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          nullable: true
          minLength: 1
          maxLength: 200
          pattern: "^[^\\x00-\\x1f\\x7f-\\x9f]*[^\\x00-\\x1f\\x7f-\\x9f\\s][^\\x00-\\x1f\\x7f-\\x9f]*$"
        pattern:
          type: string
          nullable: true
          enum:
            - Daily
            - Weekly
            - Monthly
        applyToFutureInstances:
          type: boolean
    RecurringTaskResponse:
      type: object
      required:
        - id
        - title
        - pattern
        - isActive
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        pattern:
          type: string
          enum:
            - Daily
            - Weekly
            - Monthly
        isActive:
          type: boolean
    TaskInstanceResponse:
      type: object
      required:
        - id
        - title
        - status
        - difficulty
