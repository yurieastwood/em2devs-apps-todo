<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waypoint Documentation</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      max-width: 720px;
      width: 100%;
      text-align: center;
    }

    .logo {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 1.1rem;
      margin-bottom: 3rem;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 2rem 1.5rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #60a5fa;
      box-shadow: 0 8px 30px rgba(96, 165, 250, 0.15);
    }

    .card-icon {
      font-size: 2.5rem;
    }

    .card h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #f1f5f9;
    }

    .card p {
      color: #94a3b8;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .card .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-features {
      background: rgba(167, 139, 250, 0.15);
      color: #a78bfa;
    }

    .badge-decisions {
      background: rgba(96, 165, 250, 0.15);
      color: #60a5fa;
    }

    footer {
      margin-top: 3rem;
      color: #475569;
      font-size: 0.8rem;
    }

    footer a {
      color: #64748b;
      text-decoration: none;
    }

    footer a:hover {
      color: #94a3b8;
    }

    @media (max-width: 520px) {
      .cards { grid-template-columns: 1fr; }
      h1 { font-size: 1.75rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">&#x1F9ED;</div>
    <h1>Waypoint</h1>
    <p class="subtitle">Project Documentation</p>

    <div class="cards">
      <a href="features/" class="card">
        <div class="card-icon">&#x1F4D6;</div>
        <span class="badge badge-features">BDD</span>
        <h2>Living Documentation</h2>
        <p>Browse all BDD feature files with scenarios, tags, and search. Powered by Pickles.</p>
      </a>

      <a href="decisions/" class="card">
        <div class="card-icon">&#x1F3D7;</div>
        <span class="badge badge-decisions">ADRs</span>
        <h2>Architecture Decisions</h2>
        <p>Explore architectural decision records with timeline, status tracking, and relationships.</p>
      </a>
    </div>

    <footer>
      <a href="https://github.com/yurieastwood/em2devs-apps-todo">View on GitHub</a>
    </footer>
  </div>
</body>
</html>
