$kind: http-request
url: "{{baseUrl}}/api/auth/me"
method: GET
scripts:
  - type: afterResponse
    code: >-
      pm.test('Status is 200', () => pm.response.to.have.status(200));

      const auth = pm.response.json();

      pm.test('Has userId', () => pm.expect(auth.userId).to.be.a('string'));

      pm.test('Has displayName', () =>
      pm.expect(auth.displayName).to.be.a('string'));
    language: text/javascript
order: 2000
