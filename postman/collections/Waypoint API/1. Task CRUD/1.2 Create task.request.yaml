$kind: http-request
url: "{{baseUrl}}/api/tasks"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: >-
      pm.test('Status is 201', () => pm.response.to.have.status(201));

      const task = pm.response.json();

      pm.test('Has id', () => pm.expect(task.id).to.be.a('string'));

      pm.test('Title matches', () => pm.expect(task.title).to.eql('Write
      architecture tests'));

      pm.test('Status is Todo', () => pm.expect(task.status).to.eql('Todo'));

      pm.collectionVariables.set('taskId', task.id);

      pm.test('Location header present', () =>
      pm.expect(pm.response.headers.has('Location')).to.be.true);
    language: text/javascript
order: 2000
