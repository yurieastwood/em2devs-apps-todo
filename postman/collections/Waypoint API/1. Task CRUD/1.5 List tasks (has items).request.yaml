$kind: http-request
url: "{{baseUrl}}/api/tasks"
method: GET
scripts:
  - type: afterResponse
    code: >-
      pm.test('Status is 200', () => pm.response.to.have.status(200));

      pm.test('Has at least 2 tasks', () =>
      pm.expect(pm.response.json().length).to.be.at.least(2));
    language: text/javascript
order: 5000
