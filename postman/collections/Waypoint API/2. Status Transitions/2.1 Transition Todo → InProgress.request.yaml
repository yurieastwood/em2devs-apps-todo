$kind: http-request
url: "{{baseUrl}}/api/tasks/{{taskId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: >-
      pm.test('Status is 200', () => pm.response.to.have.status(200));

      pm.test('Status is InProgress', () =>
      pm.expect(pm.response.json().status).to.eql('InProgress'));
    language: text/javascript
order: 1000
