$kind: http-request
url: "{{baseUrl}}/api/tasks?status=Todo"
method: GET
queryParams:
  status: Todo
scripts:
  - type: afterResponse
    code: >-
      pm.test('Status is 200', () => pm.response.to.have.status(200));

      const tasks = pm.response.json();

      pm.test('All tasks are Todo', () => tasks.forEach(t =>
      pm.expect(t.status).to.eql('Todo')));
    language: text/javascript
order: 2000
