$kind: http-request
url: "{{baseUrl}}/api/quests/{{questId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Correct quest', () => pm.expect(pm.response.json().id).to.eql(pm.collectionVariables.get('questId')));
    language: text/javascript
order: 3000
