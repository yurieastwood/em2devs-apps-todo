$kind: http-request
url: "{{baseUrl}}/api/quests/{{questId}}/tasks"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: >-
      pm.test('Status is 200', () => pm.response.to.have.status(200));

      const quest = pm.response.json();

      pm.test('Quest has task', () =>
      pm.expect(quest.tasks.length).to.be.at.least(1));
    language: text/javascript
order: 4000
