$kind: http-request
url: "{{baseUrl}}/api/quests/{{questId}}/tasks/{{taskId2}}"
method: DELETE
scripts:
  - type: afterResponse
    code: >-
      pm.test('Status is 200', () => pm.response.to.have.status(200));

      pm.test('Task removed', () =>
      pm.expect(pm.response.json().tasks.length).to.eql(0));
    language: text/javascript
order: 8000
