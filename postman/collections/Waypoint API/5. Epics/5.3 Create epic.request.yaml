$kind: http-request
url: "{{baseUrl}}/api/epics"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: >-
      pm.test('Status is 201', () => pm.response.to.have.status(201));

      const epic = pm.response.json();

      pm.test('Has id', () => pm.expect(epic.id).to.be.a('string'));

      pm.test('Title matches', () => pm.expect(epic.title).to.eql('Launch
      MVP'));

      pm.test('Progress is 0', () => pm.expect(epic.progress).to.eql(0));

      pm.test('Not completed', () => pm.expect(epic.isCompleted).to.be.false);

      pm.collectionVariables.set('epicId', epic.id);

      pm.test('Location header present', () =>
      pm.expect(pm.response.headers.has('Location')).to.be.true);
    language: text/javascript
order: 3000
