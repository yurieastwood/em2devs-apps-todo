$kind: http-request
url: "{{baseUrl}}/api/epics/{{epicId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Correct epic', () => pm.expect(pm.response.json().id).to.eql(pm.collectionVariables.get('epicId')));
    language: text/javascript
order: 4000
