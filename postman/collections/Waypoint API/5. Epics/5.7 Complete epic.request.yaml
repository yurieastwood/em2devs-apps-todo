$kind: http-request
url: "{{baseUrl}}/api/epics/{{epicId}}/complete"
method: POST
scripts:
  - type: afterResponse
    code: >-
      pm.test('Status is 200', () => pm.response.to.have.status(200));

      pm.test('Epic completed', () =>
      pm.expect(pm.response.json().isCompleted).to.be.true);
    language: text/javascript
order: 7000
