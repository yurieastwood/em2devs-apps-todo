$kind: http-request
url: "{{baseUrl}}/api/profile"
method: GET
scripts:
  - type: afterResponse
    code: >-
      pm.test('Status is 200', () => pm.response.to.have.status(200));

      const profile = pm.response.json();

      pm.test('Has totalXp', () =>
      pm.expect(profile.totalXp).to.be.a('number'));

      pm.test('Has level', () => pm.expect(profile.level).to.be.a('number'));

      pm.test('Has xpToNextLevel', () =>
      pm.expect(profile.xpToNextLevel).to.be.a('number'));

      pm.test('Has currentStreak', () =>
      pm.expect(profile.currentStreak).to.be.a('number'));

      pm.test('Has longestStreak', () =>
      pm.expect(profile.longestStreak).to.be.a('number'));

      pm.test('Level is at least 1', () =>
      pm.expect(profile.level).to.be.at.least(1));
    language: text/javascript
order: 1000
