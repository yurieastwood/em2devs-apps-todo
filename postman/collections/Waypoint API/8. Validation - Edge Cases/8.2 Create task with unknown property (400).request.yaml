$kind: http-request
url: "{{baseUrl}}/api/tasks"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: >-
      pm.test('Status is 400 (rejects unknown properties)', () =>
      pm.response.to.have.status(400));

      const problem = pm.response.json();pm.test('Problem Details format', () =>
      { pm.expect(problem).to.have.property('type');
      pm.expect(problem).to.have.property('title');
      pm.expect(problem).to.have.property('status');});
    language: text/javascript
order: 2000
