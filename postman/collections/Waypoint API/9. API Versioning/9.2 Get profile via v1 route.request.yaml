$kind: http-request
url: "{{baseUrl}}/api/v1/profile"
method: GET
scripts:
  - type: afterResponse
    code: >-
      pm.test('Status is 200', () => pm.response.to.have.status(200));

      pm.test('Has totalXp', () =>
      pm.expect(pm.response.json().totalXp).to.be.a('number'));
    language: text/javascript
order: 2000
